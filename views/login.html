<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍌</text></svg>">
</head>
<body>
  <header>
    <div class="header-container">
      <h1 class="logo"><a href="/">🍌 Banana Math Quest</a></h1>
      <nav class="nav-links">
        <a href="/login" class="nav-link active">Login</a>
        <a href="/register" class="nav-link">Register</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="card auth-card minimal-card">
      <h1 class="minimal-title">LOGIN</h1>

      <div id="notice" class="success-message" style="display: none;" role="status"></div>
      <div id="error" class="error-message" style="display: none;" role="alert"></div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Login</button>
      </form>

      <div class="card-footer">
        <p>Don't have an account? <a href="/register">Register</a></p>
      </div>
    </div>
  </main>

  <!-- <footer>
    <p>&copy; 2026 Banana Math Game. All rights reserved.</p>
  </footer> -->

  <script src="/js/login.js"></script>
</body>
</html>
